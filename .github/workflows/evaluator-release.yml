name: Build independent evaluator modules
on:
  workflow_dispatch:
    inputs:
      version:
        description: Evaluator version (independent of shell)
        required: true
      artifact_base_url:
        description: HTTPS download base, with no trailing slash
        required: true
jobs:
  package:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-linux
          - os: windows-latest
            target: x86_64-windows
          - os: macos-latest
            target: aarch64-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Create standalone Python release environment
        shell: bash
        run: |
          uv python install 3.11
          uv venv --python 3.11 .release-venv
          uv pip install --python .release-venv -r modules/evaluator/requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
          uv pip install --python .release-venv cryptography
      - name: Package and sign (no publication)
        shell: bash
        env:
          MODULE_SIGNING_KEY: ${{ secrets.EMBER_EVALUATOR_SIGNING_KEY }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_BASE_URL: ${{ inputs.artifact_base_url }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          test -n "$MODULE_SIGNING_KEY"
          umask 077
          printf '%s' "$MODULE_SIGNING_KEY" > "$RUNNER_TEMP/module-key"
          if [ -x .release-venv/bin/python ]; then PYTHON_RELEASE=.release-venv/bin/python; else PYTHON_RELEASE=.release-venv/Scripts/python.exe; fi
          "$PYTHON_RELEASE" scripts/desktop/package_evaluator.py --key "$RUNNER_TEMP/module-key" --version "$RELEASE_VERSION" --url "$RELEASE_BASE_URL/$RELEASE_VERSION/$RELEASE_TARGET/evaluator.zip" --output artifacts/evaluator
          rm "$RUNNER_TEMP/module-key"
      - uses: actions/upload-artifact@v4
        with:
          name: evaluator-${{ inputs.version }}-${{ matrix.target }}
          path: artifacts/evaluator/
