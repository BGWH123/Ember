[workspace]
members = ["crates/ember-core", "crates/ember-evaluator", "apps/desktop/src-tauri"]
default-members = ["crates/ember-core", "crates/ember-evaluator"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = "thin"
strip = true
